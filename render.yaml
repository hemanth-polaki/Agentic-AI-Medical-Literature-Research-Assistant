services:
  # FastAPI Backend Service
  - type: web
    name: brightlit-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: brightlit-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBMED_EMAIL
        value: medresearch@agentic.ai

databases:
  # Managed PostgreSQL Database on Render
  - name: brightlit-db
    databaseName: brightcone_db
    user: postgres
    plan: free
